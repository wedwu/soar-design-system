name: Storybooks on GitHub Pages

# Publishes both Storybooks:
#   /       the main Storybook (Web Components, every atom, molecule and organism)
#   /vue/   the Vue Storybook, loading Soar and Web Awesome from a CDN tree served next to it
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run build
      - run: npm run build -w @soar-awesome/storybook
      - run: npm run cdn:stage
      - run: npm run build -w @soar-awesome/storybook-vue
        env:
          CDN_PATH: /${{ github.event.repository.name }}/vue/cdn
      - name: Assemble site
        run: |
          mkdir -p site
          cp -r apps/storybook/storybook-static/. site/
          mkdir -p site/vue
          cp -r apps/storybook-vue/storybook-static/. site/vue/
      - uses: actions/upload-pages-artifact@v3
        with: { path: site }

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
